name: GitHub Pages'e yayınla

# Bu iş akışı depoyu olduğu gibi (statik) yayınlar.
# Legacy "branch" build'i büyük veri dosyalarında hata verdiği için Actions tabanlı
# dağıtıma geçildi; günlükler burada görünür.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages ayarları
        uses: actions/configure-pages@v5

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yayın öncesi tüm testler
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify

      - name: Siteyi hazırla (ses dosyaları CDN'den servis edilir)
        run: |
          mkdir -p site
          cp index.html manifest.json sw.js robots.txt sitemap.xml .nojekyll site/
          cp -R css js data icons site/
          du -sh site

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
