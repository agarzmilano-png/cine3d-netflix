name: Katalog indeksini yenile

# JustWatch verisi tarayıcıdan CORS nedeniyle okunamıyor; bu iş akışı sunucu
# tarafında çalışıp data/catalog.json dosyasını tazeler. Site bu dosya üzerinden
# "canlı arama" ve güncel yayıncı bilgisi sunar (sunucu/anahtar gerekmez).

on:
  schedule:
    # Her pazartesi 04:00 UTC (07:00 TR)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Çekilecek yapım sayısı'
        required: false
        default: '450'

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: İndeksi oluştur
        run: node scripts/build-catalog.js ${{ github.event.inputs.count || '450' }}

      - name: Sitemap'i tazele
        run: node scripts/generate-seo.js

      - name: Değişiklikleri işle
        id: commit
        run: |
          git config user.name "cine3d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json data/catalog-health.json sitemap.xml
          if git diff --cached --quiet; then
            echo "Değişiklik yok, indeks güncel."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: katalog indeksi guncellendi ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN ile yapılan push'lar 'on: push' akışlarını tetiklemez;
      # bu yüzden Pages dağıtımını açıkça başlatıyoruz.
      - name: Pages dağıtımını tetikle
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref master
