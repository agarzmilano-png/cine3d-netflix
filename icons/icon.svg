<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e2b" />
      <stop offset="100%" stop-color="#b80610" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff0000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Film Strip Accent -->
  <g fill="#ff1e2b" opacity="0.85">
    <rect x="64" y="80" width="384" height="24" rx="4" />
    <rect x="64" y="408" width="384" height="24" rx="4" />
  </g>
  <g fill="#0a0a0d">
    <rect x="96" y="84" width="24" height="16" rx="2" />
    <rect x="144" y="84" width="24" height="16" rx="2" />
    <rect x="192" y="84" width="24" height="16" rx="2" />
    <rect x="240" y="84" width="24" height="16" rx="2" />
    <rect x="288" y="84" width="24" height="16" rx="2" />
    <rect x="336" y="84" width="24" height="16" rx="2" />
    <rect x="384" y="84" width="24" height="16" rx="2" />
    <rect x="96" y="412" width="24" height="16" rx="2" />
    <rect x="144" y="412" width="24" height="16" rx="2" />
    <rect x="192" y="412" width="24" height="16" rx="2" />
    <rect x="240" y="412" width="24" height="16" rx="2" />
    <rect x="288" y="412" width="24" height="16" rx="2" />
    <rect x="336" y="412" width="24" height="16" rx="2" />
    <rect x="384" y="412" width="24" height="16" rx="2" />
  </g>

  <!-- Central Cine3D Monogram -->
  <g filter="url(#shadow)">
    <!-- 3D Cube / Diamond facet -->
    <path d="M256 140 L380 212 L380 348 L256 420 L132 348 L132 212 Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,30,43,0.5)" stroke-width="4"/>
    <path d="M256 140 L256 420" stroke="rgba(255,30,43,0.3)" stroke-width="3"/>
    <path d="M256 280 L380 212" stroke="rgba(255,30,43,0.3)" stroke-width="3"/>
    <path d="M256 280 L132 212" stroke="rgba(255,30,43,0.3)" stroke-width="3"/>
    
    <!-- Bold 'C3D' Graphic in Red -->
    <text x="256" y="295" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="90" fill="url(#redGlow)" letter-spacing="4">C3D</text>
  </g>
</svg>
